<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal DB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .table-wrap {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #222;
            color: white;
            padding: 14px;
            text-align: center;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        td.number,
        td.date,
        td.action {
            text-align: center;
        }

        td.title {
            font-weight: 500;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .link-btn {
            display: inline-block;
            padding: 7px 14px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }

        .link-btn:hover {
            background: #444;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            th,
            td {
                padding: 10px 6px;
                font-size: 14px;
            }

            .link-btn {
                padding: 6px 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Personal DB</h1>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="제목 검색..."
        >
    </div>

    <div class="table-wrap">

        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">번호</th>
                    <th style="width: 100px;">날짜</th>
                    <th>제목</th>
                    <th style="width: 100px;">링크</th>
                </tr>
            </thead>

            <tbody id="dataTable">
            </tbody>
        </table>

        <div
            id="emptyMessage"
            class="empty"
            style="display:none;"
        >
            자료가 없습니다.
        </div>

    </div>

</div>


<script>

    let database = [];

    // JSON 불러오기
    async function loadData() {

        try {

            const response = await fetch('https://bymaro.github.io/data.json');

            if (!response.ok) {
                throw new Error('JSON 파일을 불러올 수 없습니다.');
            }

            database = await response.json();

            renderData(database);

        } catch (error) {

            console.error(error);

            document.getElementById('dataTable').innerHTML = `
                <tr>
                    <td colspan="4" class="empty">
                        데이터를 불러오지 못했습니다.
                    </td>
                </tr>
            `;

        }
    }


    // 데이터 출력
    function renderData(data) {

        const table = document.getElementById('dataTable');
        const emptyMessage = document.getElementById('emptyMessage');

        table.innerHTML = '';

        if (data.length === 0) {

            emptyMessage.style.display = 'block';
            return;

        }

        emptyMessage.style.display = 'none';


        data.forEach(item => {

            const row = document.createElement('tr');

            row.innerHTML = `

                <td class="number">
                    ${item.number}
                </td>

                <td class="date">
                    ${item.date}
                </td>

                <td class="title">
                    ${item.title}
                </td>

                <td class="action">

                    <a
                        class="link-btn"
                        href="${item.url}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        이동
                    </a>

                </td>

            `;

            table.appendChild(row);

        });

    }


    // 검색
    document.getElementById('search').addEventListener('input', function() {

        const keyword = this.value.toLowerCase();

        const filtered = database.filter(item =>
            item.title.toLowerCase().includes(keyword)
        );

        renderData(filtered);

    });


    // 시작
    loadData();

</script>

</body>
</html>
