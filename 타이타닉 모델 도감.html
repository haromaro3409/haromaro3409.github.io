<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>타이타닉 모델 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: 선박 항해도 느낌의 차분한 종이색 바탕. 왼쪽 목차, 가운데 한 장씩 넘기는 페이지, 오른쪽에 공용 '승객 탑승권'. */
:root{
  --bg:#e8eef1; --surface:#f6f9fa; --fg:#0e2433; --muted:#566b79; --line:#c5d2d9;
  --accent:#8f6310; --accent-fill:#d9a441; --on-accent:#1b1405;
  --survive:#0f7f78; --died:#c3432b; --soft:#dbe5ea;
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1822; --surface:#122633; --fg:#e3edf1; --muted:#93a9b6; --line:#25404f;
  --accent:#e3b04b; --accent-fill:#e3b04b; --on-accent:#1b1405;
  --survive:#3dbdb2; --died:#f0735c; --soft:#1a3342; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1822; --surface:#122633; --fg:#e3edf1; --muted:#93a9b6; --line:#25404f;
  --accent:#e3b04b; --accent-fill:#e3b04b; --on-accent:#1b1405;
  --survive:#3dbdb2; --died:#f0735c; --soft:#1a3342; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:1280px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.01em}
.brand small{font-family:var(--sans);font-weight:500;color:var(--muted);font-size:12px;margin-left:8px;letter-spacing:.04em}
.top .sp{flex:1}
.count{color:var(--muted);font-size:13px}
.tocbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;min-height:0}
.rail{overflow:auto;padding:18px 0;font-size:13.5px}
.rail h4{margin:16px 0 6px;font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;text-transform:uppercase}
.rail h4:first-child{margin-top:0}
.rail button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--fg)}
.rail button:hover{background:var(--soft)}
.rail button[aria-current="page"]{background:var(--fg);color:var(--bg);font-weight:600}
main{overflow:auto;min-width:0;padding:22px 2px 30px}
.page{max-width:980px;animation:none}
.page.next{animation:inR .28s ease-out}.page.prev{animation:inL .28s ease-out}
@keyframes inR{from{transform:translateX(26px);opacity:.15}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-26px);opacity:.15}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.page.next,.page.prev{animation:none}}
.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0 calc(10px + 0px);border-top:1px solid var(--line)}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.3}
.pager button small{color:var(--muted);font-size:11px}
.pager button b{font-weight:600;font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager .nx{align-items:flex-end;justify-self:end;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pager .nx small{color:inherit;opacity:.7}
.pager button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent-fill);transform:scale(1.35)}

/* page parts */
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:6px}
.pg-title{font-size:clamp(26px,4vw,38px);margin-bottom:8px}
.lede{font-size:17px;color:var(--muted);max-width:62ch;margin-bottom:22px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;align-items:start}
.col{min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{font-size:17px;margin-bottom:10px}
.sec-h{font-family:var(--serif);font-size:18px;margin:2px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two>div{min-width:0}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:5px 0}
.pro li::marker{color:var(--survive)}.con li::marker{color:var(--died)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
ol.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12.5px;font-weight:600;font-family:var(--mono)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}
.tip{border-left:3px solid var(--accent-fill);padding:4px 0 4px 14px;color:var(--fg)}
.tip b{color:var(--accent)}
pre.code{margin:0;background:var(--fg);color:var(--bg);border-radius:10px;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.codewrap{position:relative}
.copy{position:absolute;right:8px;top:8px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg);border-radius:6px;font-size:11.5px;padding:3px 9px;cursor:pointer}
.badge{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12.5px;background:var(--surface)}
.badge b{font-family:var(--mono);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent-fill);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent-fill)}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:2px}
.lab b{color:var(--fg);font-family:var(--mono);font-weight:500}
.sw{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.sw input{accent-color:var(--accent-fill);width:17px;height:17px}

/* ticket */
.ticket{position:sticky;top:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.t-head{background:var(--fg);color:var(--bg);padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline}
.t-head b{font-family:var(--serif);letter-spacing:.06em;font-size:14px}
.t-head span{font-size:11px;letter-spacing:.14em;opacity:.75}
.t-body{padding:14px 16px;display:grid;gap:11px}
.t-stub{border-top:2px dashed var(--line);padding:12px 16px 14px;position:relative}
.t-stub::before,.t-stub::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.t-stub::before{left:-9px}.t-stub::after{right:-9px}
.t-sum{font-size:13px;color:var(--muted)}
.t-prob{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1.1}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.meter{height:9px;border-radius:6px;background:var(--died);position:relative;overflow:hidden;margin-top:8px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--survive)}
.ticket details summary{cursor:pointer}

/* charts & demos */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--fg);font-family:var(--sans);font-size:11px}
svg .m{fill:var(--muted)}
svg .ax{stroke:var(--line)}
svg .gr{stroke:var(--line);stroke-dasharray:2 3}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.lg i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.bar{display:grid;grid-template-columns:132px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:14px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar .tr .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--fg);opacity:.5}
.pos{background:var(--survive)}.neg{background:var(--died)}
.big{font-family:var(--mono);font-size:34px;font-weight:500;line-height:1}
.verdict{font-weight:600}.v1{color:var(--survive)}.v0{color:var(--died)}
.note{font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px}
.tile{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:11px;font-family:var(--mono);color:#fff;border:1px solid transparent}
.tile.off{opacity:.18}
.heat{display:grid;grid-template-columns:70px repeat(3,1fr);gap:6px;font-size:13px}
.heat div{padding:12px 8px;border-radius:8px;text-align:center}
.heat .hd{background:none;color:var(--muted);font-size:12px;padding:6px 4px}
.heat .c{color:#fff;cursor:default;font-family:var(--mono);font-size:18px}
.heat .c small{display:block;font-family:var(--sans);font-size:11px;opacity:.9}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;transition:opacity .2s}
.mcard.dim{opacity:.3}
.mcard h3{font-size:16px;margin:2px 0 4px}
.mcard .fam{font-size:11px;letter-spacing:.1em;color:var(--accent);font-weight:600}
.mcard .tg{font-size:12.5px;color:var(--muted);margin-bottom:8px;min-height:3.2em}
.at{display:grid;grid-template-columns:1fr auto;font-size:12.5px;align-items:center;gap:2px 8px}
.pips{display:inline-flex;gap:3px}.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:block}.pips i.f{background:var(--fg);border-color:var(--fg)}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;font-size:13.5px}
.toc button small{display:block;color:var(--muted);font-size:11px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:30px;align-items:start}
.hero h1{font-size:clamp(34px,6vw,58px);margin-bottom:14px}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:30;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 18px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;z-index:40}
.drag{cursor:grab;touch-action:none}

@media (max-width:980px){
  .body{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .grid2,.hero{grid-template-columns:minmax(0,1fr)}
  .ticket{position:static}
  .tocbtn{display:block}
}
@media (min-width:981px){.tocbtn{display:none}}
@media (max-width:560px){
  .two{grid-template-columns:1fr}
  .bar{grid-template-columns:96px minmax(0,1fr) 48px}
  .heat{grid-template-columns:54px repeat(3,1fr)}
  .pager button b{font-size:12.5px}
  .brand small{display:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">타이타닉 모델 도감<small>KAGGLE TITANIC</small></div>
    <div class="sp"></div>
    <span class="count mono" id="count"></span>
    <button class="tocbtn" id="tocbtn" aria-expanded="false">목차</button>
  </header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="목차"></nav>
    <main id="main"><section class="page" id="page" aria-live="polite"></section></main>
  </div>
  <footer class="pager">
    <button id="prev"><small>이전</small><b id="prevT"></b></button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button id="next" class="nx"><small>다음</small><b id="nextT"></b></button>
  </footer>
</div>

function treeWalk(t, x) { let n = 0; const path = [0];
  while (t.l[n] !== -1) { n = x[t.f[n]] <= t.t[n] ? t.l[n] : t.r[n]; path.push(n); } return { leaf: n, path }; }
const predDT = x => { const t = D.dt.tree; return t.p[treeWalk(t, x).leaf]; };

const predRF = (x, n = 25) => { const v = rfVotes(x).slice(0, n); return v.reduce((a, b) => a + b, 0) / v.length; };
function gbRun(x) { const m = D.gb.model; let F = m.init; const probs = [sigmoid(F)], contrib = [];
  m.trees.forEach(t => { const d = t.v[treeWalk(t, x).leaf] * m.lr; F += d; contrib.push(d); probs.push(sigmoid(F)); });
  return { probs, contrib }; }

function lrParts(x, inter) { const m = inter ? D.lr.inter : D.lr.plain; const xx = inter ? [...x, x[1] * x[0]] : x;
  const rows = xx.map((v, i) => ({ name: m.names[i], v, w: m.coef[i], c: m.coef[i] * v }));
  const z = rows.reduce((a, r) => a + r.c, m.bias); return { rows, bias: m.bias, z, p: sigmoid(z) }; }
const predLR = (x, inter = false) => lrParts(x, inter).p;
function mlpRun(x) { const m = D.mlp; let a = x.map((v, i) => (v - m.mean[i]) / m.scale[i]); const acts = [a];
  for (let L = 0; L < m.W.length; L++) { const W = m.W[L], b = m.b[L];
    const out = b.map((bb, j) => { let s = bb; for (let i = 0; i < a.length; i++) s += a[i] * W[i][j]; return s; });
    a = L < m.W.length - 1 ? out.map(v => Math.max(0, v)) : out.map(sigmoid); acts.push(a); }
  return { p: a[0], acts }; }
const predMLP = x => mlpRun(x).p;
const ageGroup = a => a < 13 ? 0 : (a < 40 ? 1 : 2);
function nbRun(p) { const idx = [p.gender, p.pclass - 1, ['C', 'Q', 'S'].indexOf(p.port), ageGroup(p.age)];
  const pr = D.nb.prior; let odds = pr[1] / pr[0]; const p0 = pr[1] / (pr[0] + pr[1]);
  const steps = D.nb.feats.map((f, i) => { const ps = f.surv[idx[i]], pd = f.died[idx[i]]; odds *= ps / pd;
    return { name: f.name, cat: f.cats[idx[i]], ps, pd, lr: ps / pd, after: odds / (1 + odds) }; });
  return { p0, steps, p: odds / (1 + odds) }; }
const predNB = (x, p) => nbRun(p).p;

function niceTicks(a, b, n = 5) { const out = []; const step = (b - a) / n; for (let i = 0; i <= n; i++) out.push(a + step * i); return out; }
function lineChart({ w = 520, h = 250, series, xmin, xmax, ymin, ymax, xticks, yticks, xlabel = '', fmtY = pct0, fmtX = v => v, vlines = [], points = [] }) {
  const m = { l: 44, r: 14, t: 12, b: 38 }, iw = w - m.l - m.r, ih = h - m.t - m.b;
  const X = v => m.l + (v - xmin) / (xmax - xmin) * iw, Y = v => m.t + (1 - (v - ymin) / (ymax - ymin)) * ih;
  xticks = xticks || niceTicks(xmin, xmax, 5); yticks = yticks || niceTicks(ymin, ymax, 4);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${xlabel}">`;
  yticks.forEach(t => { s += `<line class="gr" x1="${m.l}" x2="${w - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="m" x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${fmtY(t)}</text>`; });
  xticks.forEach(t => { s += `<text class="m" x="${X(t)}" y="${h - m.b + 15}" text-anchor="middle">${fmtX(t)}</text>`; });
  s += `<line class="ax" x1="${m.l}" x2="${w - m.r}" y1="${h - m.b}" y2="${h - m.b}"/><text class="m" x="${m.l + iw / 2}" y="${h - 4}" text-anchor="middle">${xlabel}</text>`;
  vlines.forEach(v => { s += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${m.t}" y2="${h - m.b}" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="${X(v.x) + 4}" y="${m.t + 10}" fill="var(--accent)" style="fill:var(--accent)">${v.label || ''}</text>`; });
  series.forEach(se => { const d = se.data.map((q, i) => `${i ? 'L' : 'M'}${X(q.x).toFixed(1)},${Y(q.y).toFixed(1)}`).join('');
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''} stroke-linejoin="round"/>`; });
  points.forEach(p => { s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="${p.color || 'var(--accent-fill)'}" stroke="var(--fg)" stroke-width="1.5"/>`; });
  return s + '</svg>';
}

/* ============================================================ 모델별 데모 */
function mkRng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };

const KNN = (() => { const r = mkRng(11), pts = [];
  for (let i = 0; i < 38; i++) pts.push({ a: clamp(31 + gauss(r) * 11, 2, 76), f: clamp(Math.exp(2.35 + gauss(r) * .55), 4, 120), y: 0 });
  for (let i = 0; i < 30; i++) pts.push({ a: clamp(27 + gauss(r) * 16, 1, 76), f: clamp(Math.exp(3.4 + gauss(r) * .85), 6, 250), y: 1 });
  const sd = k => { const m = pts.reduce((a, p) => a + p[k], 0) / pts.length; return Math.sqrt(pts.reduce((a, p) => a + (p[k] - m) ** 2, 0) / pts.length); };
  return { pts, sa: sd('a'), sf: sd('f') }; })();

/* ---- 의사결정나무 */
function treeSVG(t, maxDepth, x) {
  const pos = {}; let slot = 0;
  (function walk(n, d) { if (t.l[n] === -1 || d >= maxDepth) { pos[n] = { x: slot++, d, leaf: true }; return; }
    walk(t.l[n], d + 1); walk(t.r[n], d + 1); pos[n] = { x: (pos[t.l[n]].x + pos[t.r[n]].x) / 2, d, leaf: false }; })(0, 0);
  const CW = 132, RH = 96, NW = 118, NH = 50, W = Math.max(slot, 1) * CW, H = (maxDepth + 1) * RH - 20;
  const path = new Set(treeWalk(t, x).path.filter(n => pos[n]));
  const px = n => pos[n].x * CW + CW / 2, py = n => pos[n].d * RH + NH / 2 + 4;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="display:block;width:${W}px;max-width:none;height:auto" role="img" aria-label="의사결정나무 도식">`;
  const q = n => { const f = D.feats[t.f[n]], th = t.t[n];
    if (f === 'Gender') return { q: '여성인가?', l: '아니오', r: '예' };
    if (f.startsWith('Embarked_')) return { q: `${PORT_KO[f.slice(-1)]} 승선?`, l: '아니오', r: '예' };
    if (f === 'Pclass') return { q: `객실 등급 ≤ ${th.toFixed(1)}?`, l: '예', r: '아니오' };
    return { q: `${KO[f].replace(/\(.*\)/, '')} ≤ ${th.toFixed(1)}?`, l: '예', r: '아니오' }; };
  Object.keys(pos).forEach(k => { const n = +k; if (!pos[n].leaf) [[t.l[n], q(n).l], [t.r[n], q(n).r]].forEach(([c, lb]) => {
    const on = path.has(n) && path.has(c);
    s += `<line x1="${px(n)}" y1="${py(n) + NH / 2}" x2="${px(c)}" y2="${py(c) - NH / 2}" stroke="${on ? 'var(--accent)' : 'var(--line)'}" stroke-width="${on ? 3 : 1.6}"/>`;
    s += `<text class="m" x="${(px(n) + px(c)) / 2}" y="${(py(n) + NH / 2 + py(c) - NH / 2) / 2 + 3}" text-anchor="middle" style="${on ? 'fill:var(--accent);font-weight:600' : ''}">${lb}</text>`; }); });
  Object.keys(pos).forEach(k => { const n = +k, on = path.has(n), leaf = pos[n].leaf, p = t.p[n];
    const col = p >= .5 ? 'var(--survive)' : 'var(--died)';
    s += `<rect x="${px(n) - NW / 2}" y="${py(n) - NH / 2}" width="${NW}" height="${NH}" rx="8" fill="${leaf ? col : 'var(--surface)'}" fill-opacity="${leaf ? .9 : 1}" stroke="${on ? 'var(--accent)' : 'var(--line)'}" stroke-width="${on ? 3 : 1.4}"/>`;
    const tc = leaf ? 'style="fill:#fff"' : '';
    if (leaf) s += `<text x="${px(n)}" y="${py(n) - 4}" text-anchor="middle" ${tc} font-weight="600">${p >= .5 ? '생존' : '사망'} ${pct0(p >= .5 ? p : 1 - p)}</text><text x="${px(n)}" y="${py(n) + 12}" text-anchor="middle" ${tc} opacity=".85">승객 ${t.n[n]}명 · 생존 ${pct0(p)}</text>`;
    else s += `<text x="${px(n)}" y="${py(n) - 3}" text-anchor="middle" font-weight="600">${q(n).q}</text><text class="m" x="${px(n)}" y="${py(n) + 13}" text-anchor="middle">승객 ${t.n[n]}명 · 생존 ${pct0(p)}</text>`; });
  return s + '</svg>';
}

/* ---- SVM (설명용 가상 데이터, 선형 소프트 마진을 쌍대 좌표 하강으로 학습) */
const SV = (() => { const r = mkRng(5), pts = [];
  for (let i = 0; i < 24; i++) pts.push({ x: -.9 + gauss(r) * .85, y: -.5 + gauss(r) * .85, c: 1 });
  for (let i = 0; i < 24; i++) pts.push({ x: .9 + gauss(r) * .85, y: .6 + gauss(r) * .85, c: -1 });
  return pts; })();
function trainSVM(pts, C) { const n = pts.length, al = new Array(n).fill(0); let w = [0, 0, 0];
  const Q = pts.map(p => p.x * p.x + p.y * p.y + 1);
  for (let it = 0; it < 400; it++) for (let i = 0; i < n; i++) { const p = pts[i];
    const G = p.c * (w[0] * p.x + w[1] * p.y + w[2]) - 1; const na = clamp(al[i] - G / Q[i], 0, C), d = na - al[i];
    if (d) { w[0] += d * p.c * p.x; w[1] += d * p.c * p.y; w[2] += d * p.c; al[i] = na; } }
  return { w, al }; }

  const W = 520, H = 280, m = 14, X = v => m + (v + 3) / 6 * (W - 2 * m), Y = v => m + (1 - (v + 2.4) / 4.8) * (H - 2 * m);

    const seg = (o, st) => { const [[x1, y1], [x2, y2]] = line(o); return `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" ${st}/>`; };
    const sv = SV.filter((p, i) => al[i] > 1e-6); const wn = Math.hypot(w[0], w[1]);
    let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="SVM 마진 도식"><rect x="${m}" y="${m}" width="${W - 2 * m}" height="${H - 2 * m}" fill="none" class="ax" stroke="var(--line)"/>`;
    s += seg(1, 'stroke="var(--accent)" stroke-dasharray="5 4"') + seg(-1, 'stroke="var(--accent)" stroke-dasharray="5 4"') + seg(0, 'stroke="var(--fg)" stroke-width="2.4"');
    SV.forEach((p, i) => { const isS = al[i] > 1e-6; s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${isS ? 7 : 5}" fill="${p.c > 0 ? 'var(--survive)' : 'var(--died)'}" fill-opacity="${isS ? 1 : .6}" stroke="${isS ? 'var(--fg)' : 'none'}" stroke-width="1.6"/>`; });
    $('#sv-svg', root).innerHTML = s + '</svg>';
    $('#sv-info', root).innerHTML = `굵은 선이 경계, 점선이 마진입니다. 테두리가 있는 점이 <b>서포트 벡터(${sv.length}개)</b>로, 경계는 이 점들만으로 결정됩니다. 마진 폭은 <b class="mono">${(2 / wn).toFixed(2)}</b>입니다. C를 키우면 마진이 좁아지며 점을 맞히려 하고, 줄이면 마진이 넓어집니다. 점은 설명용 가상 데이터입니다.`; };
  $('#sv-c', root).oninput = draw; draw();
  const r2 = mkRng(9), L = []; for (let i = 0; i < 9; i++) L.push({ x: (r2() * 2 - 1) * .85, c: 1 });
  for (let i = 0; i < 10; i++) L.push({ x: (i % 2 ? 1 : -1) * (1.5 + r2() * 1.3), c: -1 });
  const lift = () => { const on = $('#sv-lift', root).checked, w = 520, h = on ? 230 : 120, ml = 30;
    const X2 = v => ml + (v + 3) / 6 * (w - 2 * ml), Y2 = v => h - 30 - v / 9 * (h - 50);
    let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="커널 효과">`;
    s += `<line class="ax" x1="${ml}" x2="${w - ml}" y1="${on ? h - 30 : h / 2}" y2="${on ? h - 30 : h / 2}"/>`;
    [-3, -2, -1, 0, 1, 2, 3].forEach(t => s += `<text class="m" x="${X2(t)}" y="${on ? h - 14 : h / 2 + 22}" text-anchor="middle">${t}</text>`);
    if (on) { s += `<line x1="${ml}" x2="${w - ml}" y1="${Y2(1.6)}" y2="${Y2(1.6)}" stroke="var(--fg)" stroke-width="2.4"/><text class="m" x="${w - ml}" y="${Y2(1.6) - 6}" text-anchor="end">새 경계: x² = 1.6</text><text class="m" x="${ml}" y="12">x²</text>`; }
    L.forEach(p => s += `<circle cx="${X2(p.x)}" cy="${on ? Y2(p.x * p.x) : h / 2 - 2}" r="6" fill="${p.c > 0 ? 'var(--survive)' : 'var(--died)'}" stroke="var(--fg)" stroke-width="1"/>`);
    $('#sv-lsvg', root).innerHTML = s + '</svg>';
    $('#sv-linfo', root).textContent = on ? 'x²를 새 축으로 올리자 한 줄(가로선)로 두 집단이 갈립니다. RBF 같은 커널은 이런 변환을 직접 계산하지 않고 같은 효과를 냅니다.' : '한 줄 위에서 청록 점은 가운데, 적색 점은 양쪽 바깥에 있어 점 하나를 기준으로는 가를 수 없습니다.'; };
  $('#sv-lift', root).onchange = lift; lift();
};

DEMOS.network = root => {
  const sizes = [8, 10, 7, 1], cx = [120, 260, 400, 535], W = 600, H = 400;
  const ny = (L, i) => 30 + (i + .5) * (H - 60) / sizes[L];
  root.innerHTML = `<div class="scroll-x"><svg id="nn" viewBox="0 0 ${W} ${H}" style="min-width:520px;width:100%;height:auto;display:block" role="img" aria-label="신경망 구조와 현재 승객의 활성화"></svg></div>
    <div class="row" style="justify-content:space-between;margin-top:6px"><span class="big" id="nn-p"></span><span id="nn-v"></span></div>
    <p class="note" style="margin-top:6px">원이 진할수록 활성화가 큽니다. 진한 선은 켜는(+) 연결, 황동색 선은 끄는(−) 연결이고, 선의 진하기는 이번 승객에서 실제로 전달된 신호 크기입니다. 노트북과 같은 10-7 구성으로 실제 학습한 가중치를 씁니다(학습 정확도 ${pct0(D.mlp.train_acc)}).</p>
    <h3 class="sec-h" style="margin-top:16px">파라미터 수 계산기</h3>
    <div class="row"><label>은닉층 1 <input type="number" id="nn-a" value="10" min="1" max="256" style="width:70px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"></label>
    <label>은닉층 2 <input type="number" id="nn-b" value="7" min="0" max="256" style="width:70px;padding:5px;border:1px solid var(--line);border-radius:6px;background:var(--bg)"></label></div>
    <div id="nn-par" class="note" style="margin-top:6px"></div>
    <h3 class="sec-h" style="margin-top:16px">활성화 함수</h3><div id="nn-act" class="row" style="gap:14px"></div>`;
  const upd = () => { const x = vecOf(), r = mlpRun(x), A = r.acts, Wt = D.mlp.W; let s = '';
    const mx = A.map(l => Math.max(...l.map(Math.abs), 1e-6));
    for (let L = 0; L < 3; L++) { const mxE = Math.max(...Wt[L].flatMap((row, i) => row.map(w => Math.abs(w * A[L][i]))), 1e-6);
      Wt[L].forEach((row, i) => row.forEach((w, j) => { const f = Math.abs(w * A[L][i]) / mxE, neg = w * A[L][i] < 0;
        s += `<line x1="${cx[L]}" y1="${ny(L, i)}" x2="${cx[L + 1]}" y2="${ny(L + 1, j)}" stroke="${neg ? 'var(--accent)' : 'var(--fg)'}" stroke-width="${.5 + f * 2}" opacity="${.05 + f * .8}"/>`; })); }
    A.forEach((l, L) => l.forEach((v, i) => { const a = Math.abs(v) / mx[L], out = L === 3;
      const fill = out ? (v >= .5 ? 'var(--survive)' : 'var(--died)') : 'var(--accent-fill)';
      s += `<circle cx="${cx[L]}" cy="${ny(L, i)}" r="${out ? 17 : 11}" fill="${fill}" fill-opacity="${out ? .95 : .12 + a * .88}" stroke="var(--fg)" stroke-width="1.2"><title>${out ? '생존 확률 ' + pct(v) : '활성화 ' + v.toFixed(2)}</title></circle>`; }));
    D.feats.forEach((f, i) => s += `<text class="m" x="${cx[0] - 18}" y="${ny(0, i) + 4}" text-anchor="end">${KO[f].replace(/\(.*\)/, '')}</text>`);
    [['입력층 8', 0], ['은닉층 10 · ReLU', 1], ['은닉층 7 · ReLU', 2], ['출력 1 · 시그모이드', 3]].forEach(([t, L]) => s += `<text class="m" x="${cx[L]}" y="14" text-anchor="middle">${t}</text>`);
    s += `<text x="${cx[3]}" y="${ny(3, 0) + 36}" text-anchor="middle" font-weight="600">${pct(r.p)}</text>`;
    $('#nn', root).innerHTML = s; $('#nn-p', root).textContent = pct(r.p); $('#nn-v', root).innerHTML = verdictHTML(r.p); };
  onP(upd);
  const par = () => { const a = Math.max(1, +$('#nn-a', root).value || 1), b = Math.max(0, +$('#nn-b', root).value || 0), n = 8;
    const p1 = (n + 1) * a, p2 = b ? (a + 1) * b : 0, p3 = ((b || a) + 1);
    $('#nn-par', root).innerHTML = `(8+1)×${a} = <b class="mono">${p1}</b>${b ? ` + (${a}+1)×${b} = <b class="mono">${p2}</b>` : ''} + (${b || a}+1)×1 = <b class="mono">${p3}</b> → 합계 <b class="mono">${p1 + p2 + p3}</b>개. 학습 데이터는 ${D.n_rows}행이라 파라미터가 많을수록 외우기 쉬워집니다.`; };
  $('#nn-a', root).oninput = par; $('#nn-b', root).oninput = par; par();
  const mini = (name, f, d) => { const pts = []; for (let x = -4; x <= 4.01; x += .2) pts.push(`${(14 + (x + 4) / 8 * 112).toFixed(1)},${(66 - (f(x) + 1.2) / 5.2 * 56).toFixed(1)}`);
    return `<figure style="margin:0"><svg viewBox="0 0 140 80" width="140"><line class="ax" x1="14" x2="126" y1="${66 - 1.2 / 5.2 * 56}" y2="${66 - 1.2 / 5.2 * 56}"/><line class="ax" x1="70" x2="70" y1="6" y2="70"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--fg)" stroke-width="2"/></svg><figcaption class="note" style="width:140px"><b style="color:var(--fg)">${name}</b><br>${d}</figcaption></figure>`; };
  $('#nn-act', root).innerHTML = mini('ReLU', x => Math.max(0, x), '음수는 0, 양수는 그대로. 은닉층에 사용') + mini('시그모이드', x => sigmoid(x) * 4 - 1 + .0, '0~1로 눌러 확률로 변환. 출력층에 사용') + mini('tanh', x => Math.tanh(x), '−1~1로 누름. 값이 0 중심');
};

  ...['logistic', 'knn', 'tree', 'forest', 'boosting', 'svm', 'bayes', 'network'].map(k => ({ id: k, group: '모델', title: M[k].name.replace(/ \(.*\)/, ''), build: () => modelPage(k) })),

    return { html: `<div class="eyebrow">비교</div><h2 class="pg-title">같은 승객, 여섯 가지 판단</h2>
      <p class="lede">같은 승객을 학습된 모델에 넣었을 때 모델마다 생존 확률이 얼마나 다른지 봅니다. 특이한 승객일수록 의견이 갈립니다.</p>

      <section class="card"><h3>모델별 생존 확률</h3><div id="cmp"></div><div id="cmp-s" class="note" style="margin-top:10px"></div></section>
      <p class="note">k-NN과 SVM은 예측할 때 학습 데이터(또는 서포트 벡터)를 직접 사용하므로, 이 페이지에는 원본 데이터 없이 담을 수 있는 여섯 모델만 넣었습니다. 선의 중앙은 50%입니다.</p></div><div class="side">${ticketHTML(false)}</div></div>`,
      mount: root => { bindTicket($('.side', root)); $$('#presets .chip', root).forEach(b => b.onclick = () => setP(presets[+b.dataset.i][1]));
        onP(() => { const r = allProbs(), ps = r.map(m => m.p), avg = ps.reduce((a, b) => a + b, 0) / ps.length, mn = Math.min(...ps), mx = Math.max(...ps);
          $('#cmp', root).innerHTML = r.map(m => probBar(m.name, m.p)).join('') + `<div class="bar" style="border-top:1px solid var(--line);padding-top:6px"><span class="nm"><b>평균</b></span><span class="tr"><i style="width:${avg * 100}%;background:var(--fg)"></i><span class="mid"></span></span><span class="mono"><b>${pct0(avg)}</b></span></div>`;

  { id: 'scores', group: '비교', title: '점수표', build() {
    const rows = ['gb', 'rf', 'svm', 'dt', 'lr', 'mlp', 'knn', 'nb'].map(k => Object.assign({ k }, D.cv[k]));
    const lbl = { gb: '그래디언트 부스팅', rf: '랜덤 포레스트', svm: 'SVM (RBF)', dt: '의사결정나무', lr: '로지스틱 회귀', mlp: '다층 신경망', knn: 'k-NN', nb: '나이브 베이즈' };
    const top4 = rows.slice(0, 4).map(r => r.mean), spread = Math.max(...top4) - Math.min(...top4), stds = rows.map(r => r.std), lo = Math.min(...stds), hi = Math.max(...stds);

      <div class="two" style="margin-top:14px"><div class="card"><h3>로지스틱 회귀 + 상호작용</h3><p>성별×등급 항을 더하면 ${pct(D.lr.plain.cv)}에서 ${pct(D.lr.inter.cv)}로 바뀝니다. 특성을 직접 만드는 것이 모델을 바꾸는 것만큼 효과가 있을 수 있습니다.</p></div>
      <div class="card"><h3>점수는 설정에 따라 달라집니다</h3><p>트리 계열 설정, k-NN의 k, 신경망의 학습률과 같은 값은 위 표의 설정(각 모델 페이지의 시작값)을 따랐고 따로 튜닝하지 않았습니다.</p></div></div>`,
      mount: root => { const draw = sortBy => { const rs = rows.slice().sort((a, b) => sortBy === 'name' ? lbl[a.k].localeCompare(lbl[b.k], 'ko') : b.mean - a.mean);
        const W = 640, rh = 38, ml = 150, mr = 16, top = 34, H = top + rs.length * rh + 30, lo = .55, hi = .85, X = v => ml + (v - lo) / (hi - lo) * (W - ml - mr);
        let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="모델별 교차검증 정확도">`;

        [[D.cv.baseline.mean, '전부 사망', 'var(--muted)'], [D.cv.gender_only.mean, '성별만', 'var(--accent)']].forEach(([v, t, c], i) => s += `<line x1="${X(v)}" x2="${X(v)}" y1="${top - 8}" y2="${H - 26}" stroke="${c}" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(v) + (i ? 4 : -4)}" y="${top - 14}" text-anchor="${i ? 'start' : 'end'}" style="fill:${c}" font-weight="600">${t} ${pct0(v)}</text>`);
        rs.forEach((r, i) => { const y = top + i * rh + rh / 2; s += `<text x="${ml - 12}" y="${y + 4}" text-anchor="end" font-weight="${i === 0 && sortBy !== 'name' ? 600 : 400}">${lbl[r.k]}</text>
          <line x1="${X(r.mean - r.std)}" x2="${X(r.mean + r.std)}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-width="2.4" opacity=".55"/><circle cx="${X(r.mean)}" cy="${y}" r="7" fill="var(--accent-fill)" stroke="var(--fg)" stroke-width="1.8"><title>${lbl[r.k]} ${pct(r.mean)} ±${(r.std * 100).toFixed(1)}</title></circle>
          <text class="mono" x="${W - mr}" y="${y - 12}" text-anchor="end" style="font-size:11px">${pct(r.mean)}</text>`; });
        $('#dots', root).innerHTML = s + '</svg>'; };
        $$('[data-s]', root).forEach(b => b.onclick = () => { $$('[data-s]', root).forEach(x => x.setAttribute('aria-pressed', String(x === b))); draw(b.dataset.s); }); draw('score'); } }; } },
  { id: 'wrap', group: '비교', title: '정리', build() {
    return { html: `<div class="eyebrow">비교</div><h2 class="pg-title">모델은 이 순서로 고르세요</h2>
      <p class="lede">점수 차이가 작은 대회일수록 순서와 검증 방법이 결과를 좌우합니다.</p>
      <div class="grid2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><section class="card"><h3>권장 순서</h3><ol class="steps">
        <li><span><b>기준선부터.</b> 성별만으로 예측하면 약 ${pct0(D.cv.gender_only.mean)}입니다. 이보다 낮다면 전처리나 검증에 문제가 있습니다.</span></li>
        <li><span><b>로지스틱 회귀로 파이프라인 검증.</b> 전처리, 교차검증, 제출 파일 형식을 가장 단순한 모델로 먼저 끝까지 돌립니다.</span></li>
        <li><span><b>트리 계열로 비선형 확인.</b> 랜덤 포레스트와 그래디언트 부스팅은 기본값으로도 보통 상위권입니다.</span></li>
        <li><span><b>교차검증으로 비교하고, 비슷하면 단순한 쪽.</b> 상위 모델들의 확률을 평균하는 앙상블도 시도할 만합니다.</span></li>
        <li><span><b>신경망은 마지막.</b> 수백 행 규모에서는 이점이 크지 않지만, 구조를 배우는 목적이라면 충분히 의미가 있습니다.</span></li></ol></section>
      <section class="card"><h3>지금 만드는 노트북과 연결하면</h3><p>노트북의 모델은 은닉층 10-7의 다층 신경망이고, 같은 전처리에서 교차검증 정확도는 약 <b class="mono">${pct(D.cv.mlp.mean)}</b>입니다. 트리 계열과 SVM은 약 ${pct0(D.cv.rf.mean)} 안팎으로 조금 높지만 폴드 간 흔들림(±${(D.cv.mlp.std * 100).toFixed(1)}%p)과 비슷한 크기입니다.</p>
      <p style="margin-top:10px">그래서 신경망을 유지하더라도 결과가 이상하다고 볼 필요는 없습니다. 비교 실험을 하고 싶다면 모델 셀 하나만 바꿔 같은 교차검증으로 점수를 나란히 놓아 보세요.</p></section></div>
      <h3 class="sec-h" style="margin-top:26px">다시 보고 싶은 페이지</h3><div class="toc" id="toc2"></div>`,
      mount: root => { $('#toc2', root).innerHTML = PAGES.slice(1, -1).map(p => `<button type="button" data-go="${p.id}">${p.title}<small>${p.group}</small></button>`).join(''); } }; } }
];

/* ============================================================ 라우터 */
const pageEl = $('#page'), mainEl = $('#main');
let cur = -1;
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1700); }
function buildRail() {
  let s = '', g = '';
  PAGES.forEach((p, i) => { if (p.group !== g) { g = p.group; s += `<h4>${g}</h4>`; } s += `<button type="button" data-go="${p.id}" data-i="${i}">${p.title}</button>`; });
  $('#rail').innerHTML = s;
  $('#dots').innerHTML = PAGES.map(() => '<i></i>').join('');
}
function show(i, dir) {
  i = clamp(i, 0, PAGES.length - 1); const first = cur < 0; const d = dir || (i >= cur ? 'next' : 'prev'); cur = i;
  const p = PAGES[i], built = p.build();
  listeners = [];
  pageEl.className = 'page'; void pageEl.offsetWidth; pageEl.innerHTML = built.html;
  if (!first) pageEl.classList.add(d);
  if (built.mount) built.mount(pageEl);
  mainEl.scrollTop = 0;
  $('#count').textContent = `${i + 1} / ${PAGES.length}`;
  $$('#rail button').forEach(b => b.removeAttribute('aria-current')); const rb = $(`#rail button[data-i="${i}"]`); if (rb) rb.setAttribute('aria-current', 'page');
  $$('#dots i').forEach((e, j) => e.classList.toggle('on', j === i));
  const pv = PAGES[i - 1], nx = PAGES[i + 1];
  $('#prev').disabled = !pv; $('#prevT').textContent = pv ? pv.title : '처음'; $('#next').disabled = !nx; $('#nextT').textContent = nx ? nx.title : '마지막';
  document.title = `${p.title} · 타이타닉 모델 도감`;
}
const go = id => { const i = PAGES.findIndex(p => p.id === id); if (i < 0) return; if (location.hash !== '#' + id) location.hash = id; else show(i); };
window.addEventListener('hashchange', () => { const i = PAGES.findIndex(p => p.id === location.hash.slice(1)); if (i >= 0 && i !== cur) show(i); });
document.addEventListener('click', e => { const t = e.target.closest('[data-go]'); if (t) { closeToc(); go(t.dataset.go); } });
$('#prev').onclick = () => cur > 0 && go(PAGES[cur - 1].id);
$('#next').onclick = () => cur < PAGES.length - 1 && go(PAGES[cur + 1].id);
document.addEventListener('keydown', e => { if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight') $('#next').click(); else if (e.key === 'ArrowLeft') $('#prev').click(); else if (e.key === 'Escape') closeToc(); });
let ov = null;
function closeToc() { if (ov) { ov.remove(); ov = null; $('#tocbtn').setAttribute('aria-expanded', 'false'); } }
$('#tocbtn').onclick = () => { if (ov) return closeToc(); ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>목차</h3><button class="tocbtn" type="button" id="tocx" style="display:block">닫기</button></div><div class="toc">${PAGES.map(p => `<button type="button" data-go="${p.id}">${p.title}<small>${p.group}</small></button>`).join('')}</div>`;
  document.body.appendChild(ov); $('#tocx').onclick = closeToc; $('#tocbtn').setAttribute('aria-expanded', 'true'); };
buildRail();
{ const i = PAGES.findIndex(p => p.id === location.hash.slice(1)); show(i >= 0 ? i : 0, 'next'); }
window.__show = show; window.__pages = PAGES.map(p => p.id);
</script>
