<style>
/* 레이아웃: 청사진 풍 관제실. 위에 큰 타이머, 왼쪽에 클릭 가능한 방 단면도, 오른쪽에 단서 노트와 힌트. */
:root {
  --bg: #0c2340;
  --grid: rgba(111, 155, 201, 0.10);
  --panel: #12315a;
  --panel-2: #0f2a4d;
  --line: #6f9bc9;
  --line-soft: #2b5283;
  --fg: #e7f0f9;
  --fg-dim: #a3bdd6;
  --accent: #ffcf3f;
  --accent-ink: #1a1500;
  --danger: #ff7a66;
  --ok: #6fe0a8;
  --paper: #e9f1f7;
  --ink: #17335a;
  --ink-soft: rgba(23, 51, 90, 0.28);
  --screen: #07182b;
  --bk-red: #f0686c;
  --bk-orange: #f4a05a;
  --bk-yellow: #f4c542;
  --bk-green: #4cc38a;
  --bk-blue: #5aaaf8;
  --bk-purple: #b497f7;
  --f-display: 'Black Han Sans', 'Noto Sans KR', sans-serif;
  --f-body: 'Noto Sans KR', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {

  background-size: 32px 32px;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: 20px 32px;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.eyebrow { font: 500 12px var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font: 400 clamp(30px, 6vw, 46px)/1.05 var(--f-display); margin: 0; text-wrap: balance; }
.timerbox { min-width: min(100%, 220px); }
.timer { font: 700 clamp(44px, 9vw, 68px)/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.timer.low { color: var(--danger); }
.bar { height: 6px; background: var(--line-soft); margin-top: 8px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
.timer.low + .bar i { background: var(--danger); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stage { border: 1px solid var(--line); background: var(--panel-2); padding: 8px; min-width: 0; }
.stage svg { display: block; width: 100%; height: auto; }
.stage-note { margin: 8px 4px 2px; font: 500 12px var(--f-mono); color: var(--fg-dim); letter-spacing: 0.04em; }
.side { display: grid; gap: 16px; min-width: 0; }
.panel { border: 1px solid var(--line-soft); background: var(--panel); padding: 14px; min-width: 0; }
h2 { font: 700 12px var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 10px; color: var(--fg-dim); }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.list li { font-size: 14px; line-height: 1.5; border-left: 2px solid var(--accent); padding-left: 10px; overflow-wrap: anywhere; }
.list li.empty { border-left-color: var(--line-soft); color: var(--fg-dim); }
.list li b { font-family: var(--f-mono); font-weight: 700; color: var(--accent); }
.hint-btn { margin-bottom: 10px; width: 100%; }

.btn { font: 700 15px var(--f-body); padding: 10px 16px; min-height: 44px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, .x:focus-visible, input:focus-visible, .sw:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

/* 방 */
.wall { fill: var(--panel); }
.floor { fill: var(--panel-2); stroke: var(--line-soft); }
.hot { cursor: pointer; }
.hot:focus { outline: none; }
.only-hard { display: none; }
.is-hard .only-hard { display: inline; }
.edge { stroke: var(--line); stroke-width: 2; transition: stroke 0.15s; }
.hot:hover .edge, .hot:focus-visible .edge { stroke: var(--accent); stroke-width: 3.5; }
.tag { font: 700 14px var(--f-body); fill: var(--fg); text-anchor: middle; paint-order: stroke; stroke: var(--panel-2); stroke-width: 4px; }
.hot:hover .tag, .hot:focus-visible .tag { fill: var(--accent); }
.tag.done { fill: var(--ok); }
.scrawl { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; opacity: 0.55; }
.scr-txt { font: 700 13px var(--f-mono); fill: var(--accent); }

/* 시계 */
.c-face { fill: var(--paper); stroke: var(--line); stroke-width: 2; }
.c-tick { stroke: var(--ink); stroke-width: 0.8; }
.c-num { font: 700 9px var(--f-mono); fill: var(--ink); }
.c-hour { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.c-min { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.c-pin { fill: var(--ink); }
.bigclock { display: block; width: min(100%, 320px); margin: 0 auto; }

/* 팝업 */
#layer { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(6, 16, 30, 0.82); }
.sheet { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); padding: 20px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.sheet h3 { font: 400 26px/1.15 var(--f-display); margin: 0; text-wrap: balance; }
.x { font: 700 14px var(--f-body); min-height: 40px; padding: 6px 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.sheet p { margin: 0 0 12px; }
.dim { color: var(--fg-dim); }
.rules { margin: 0 0 16px; padding-left: 20px; }
.rules li { margin-bottom: 4px; }
.msg { min-height: 24px; margin: 8px 0 0; font-weight: 700; color: var(--danger); }
.shake { animation: shake 0.3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pulse { 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: no-preference) { .timer.low { animation: pulse 1s steps(2) infinite; } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

/* 난이도 선택 */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
@media (max-width: 520px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.mode { position: relative; display: grid; align-content: start; gap: 4px; padding: 12px; border: 1px solid var(--line-soft); background: var(--panel-2); cursor: pointer; min-width: 0; }
.mode input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.mode:has(input:checked) { border-color: var(--accent); background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent); }
.mode:has(input:focus-visible) { outline: 3px solid var(--fg); outline-offset: 2px; }
.m-name { font: 400 22px/1.1 var(--f-display); }
.m-time { font: 700 14px var(--f-mono); color: var(--accent); }
.m-desc { font-size: 13px; line-height: 1.45; color: var(--fg-dim); }

.board { background: var(--paper); color: var(--ink); padding: 18px; }
.board .small { font: 500 12px var(--f-mono); opacity: 0.6; margin: 0 0 6px; }
.eq { display: flex; justify-content: space-between; gap: 12px; font: 700 clamp(20px, 5.5vw, 28px) var(--f-mono); border-bottom: 2px dashed var(--ink-soft); padding: 10px 0; }
.board .foot { margin: 12px 0 0; font-weight: 700; }

.dials { display: flex; gap: 12px; justify-content: center; margin: 16px 0 8px; }
.dial { display: grid; gap: 6px; justify-items: center; }
.dial label { font: 700 26px var(--f-mono); color: var(--accent); }
.dial input, .codein { text-align: center; font: 700 36px var(--f-mono); background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.dial input { width: min(64px, 19vw); height: 76px; }
.codein { width: 100%; height: 76px; letter-spacing: 0.4em; padding-left: 0.4em; }
.center { text-align: center; }
.note { background: var(--paper); color: var(--ink); padding: 16px; font-weight: 500; }
.note .cipher { font: 700 clamp(28px, 8vw, 36px) var(--f-mono); letter-spacing: 0.2em; margin: 4px 0 8px; overflow-wrap: anywhere; }
.note .cap { margin: 0 0 4px; opacity: 0.7; }
.crt { background: var(--screen); border: 1px solid var(--line); padding: 16px; font: 500 14px/1.8 var(--f-mono); color: var(--accent); overflow-wrap: anywhere; }
.crt input { width: 100%; margin-top: 8px; font: 700 22px var(--f-mono); letter-spacing: 0.2em; text-transform: uppercase; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 10px; }
.shelf { display: flex; gap: 8px; justify-content: center; align-items: flex-end; padding: 18px 8px 0; background: var(--panel-2); border-bottom: 10px solid var(--line-soft); }
.book { flex: 1 1 0; max-width: 58px; min-width: 0; display: grid; justify-items: center; align-content: start; gap: 6px; padding: 12px 0; font: 700 30px var(--f-mono); color: #0a1626; }
.book small { font: 700 12px var(--f-body); }
.book.red { background: var(--bk-red); } .book.orange { background: var(--bk-orange); } .book.yellow { background: var(--bk-yellow); } .book.green { background: var(--bk-green); } .book.blue { background: var(--bk-blue); } .book.purple { background: var(--bk-purple); }

.plate { background: var(--paper); color: var(--ink); padding: 14px 16px; font-weight: 700; }
.plate p { margin: 0 0 6px; }

.sws { display: flex; gap: 12px; justify-content: center; margin: 16px 0 8px; }
.sw { display: grid; gap: 4px; justify-items: center; width: 84px; padding: 10px 0; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; font: 700 22px var(--f-mono); }
.sw small { font: 700 12px var(--f-body); color: var(--fg-dim); }
.sw[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }

#toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: var(--danger); color: #1b0500; font-weight: 700; padding: 10px 16px; max-width: calc(100% - 32px); }
</style>

    });
    h += '</div></fieldset><ul class="rules" id="rules">' + rulesHTML() + '</ul><button id="go" class="btn" style="width:100%">시작하기</button>';
    show('제7관제실에 갇혔다', h, false);
    sheet.querySelectorAll('input[name="mode"]').forEach(function (r) {
      r.addEventListener('change', function () {
        selected = r.value;
        try { localStorage.setItem('escape7-mode', selected); } catch (e) {}
        applyMode();
        $('#rules').innerHTML = rulesHTML();
      });
    });
    $('#go').addEventListener('click', function () {
      S.started = true; S.t0 = Date.now();
      hintBtn.disabled = false;
      layer.hidden = true;
      tickId = setInterval(tick, 100);
      tick();
    });
  }

  try {
    var saved = localStorage.getItem('escape7-mode');
    if (saved && MODES[saved]) selected = saved;
  } catch (e) {}
  S = freshState();
  applyMode();
  intro();
})();
</script>

</body></html>
