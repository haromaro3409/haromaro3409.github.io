<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재미있는 스도쿠!</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#fff0f5;color:#405b43;font-family:Arial,"Malgun Gothic",sans-serif;text-align:center}
h1{color:#e76f91;margin:8px}
.subtitle{color:#77966d}
button,select{border:0;border-radius:12px;padding:10px 13px;margin:4px;background:#d8eacb;color:#35563a;font-size:15px;cursor:pointer}
button:hover{filter:brightness(.96);transform:scale(1.03)}
.main{display:flex;justify-content:center;align-items:center;gap:0;margin:20px auto;max-width:760px}
#board{display:grid;grid-template-columns:repeat(9,min(9.5vw,48px));grid-template-rows:repeat(9,min(9.5vw,48px));border:3px solid #638b65;background:white}
.cell{border:1px solid #c7d8bf;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative;min-width:0;min-height:0}
.cell:nth-child(3n){border-right:2px solid #71976c}
.cell:nth-child(9n){border-right:0}
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #71976c}
.cell.selected{background:#ffd9e5!important}
.cell.fixed{font-weight:bold;color:#456b4b}
.cell.same{background:#e8f2df}
.cell .note{font-size:9px;color:#77966d}
.sidecat{width:125px;flex-shrink:0;margin-left:-12px;z-index:2;cursor:pointer;transition:transform .2s}
.sidecat:hover{transform:translateY(-5px) rotate(3deg)}
.catface{width:115px;height:100px;background:#fffaf1;border:4px solid #d8a77b;border-radius:48% 48% 43% 43%;position:relative;margin:auto;box-shadow:0 5px 0 #e6c9a9}
.ear{position:absolute;top:-19px;width:37px;height:40px;background:#fffaf1;border:4px solid #d8a77b;transform:rotate(45deg);border-radius:8px 18px 3px 15px;z-index:-1}
.ear.left{left:3px}
.ear.right{right:3px;transform:rotate(45deg) scaleX(-1)}
.eye{position:absolute;top:39px;width:9px;height:13px;background:#4a443f;border-radius:50%}
.eye.left{left:27px}
.eye.right{right:27px}
.nose{position:absolute;left:50%;top:55px;transform:translateX(-50%);width:9px;height:6px;background:#e88a9b;border-radius:50%}
.mouth{position:absolute;left:50%;top:61px;transform:translateX(-50%);font-size:18px;color:#9a6b62}
.cheek{position:absolute;top:56px;width:17px;height:8px;background:#ffc4ce;border-radius:50%}
.cheek.left{left:10px}
.cheek.right{right:10px}
.catbody{width:85px;height:53px;background:#fffaf1;border:3px solid #d8a77b;border-radius:48%;margin:-3px auto 0}
.catmsg{background:#fff;border:2px solid #f3bfd0;border-radius:12px;padding:8px;font-size:12px;margin:10px -8px 0;min-height:36px}
.heart{position:fixed;color:#ec7198;font-size:22px;animation:float 1s forwards;pointer-events:none;z-index:200}
@keyframes float{to{transform:translateY(-65px) scale(1.5);opacity:0}}
.tools{max-width:560px;margin:auto}
#message{min-height:26px;color:#e16b8c;font-weight:bold}
#gameArea{display:none}
#startScreen{position:fixed;inset:0;z-index:100;background:#fff0f5;display:flex;justify-content:center;align-items:center;padding:15px}
.startCard{background:white;padding:25px;border-radius:25px;border:4px solid #d8eacb;max-width:380px;width:100%;box-shadow:0 10px 30px #e8b7c766}
.startCard h1{font-size:29px}
.startCat{font-size:55px;margin:8px}
.startCard p{color:#77966d}
.startCard select{font-size:18px;padding:12px;background:#e7f1dc}
.startButton{background:#e99ab0;color:white;font-size:20px;padding:14px 30px}
@media(max-width:520px){
 body{padding:8px}
 .main{margin:14px auto}
 .sidecat{width:75px;margin-left:-7px}
 .catface{transform:scale(.68);transform-origin:center bottom;margin-bottom:-25px}
 .catbody{transform:scale(.7);margin-top:0}
 .catmsg{font-size:10px;padding:5px;margin:5px -15px 0}
 #board{grid-template-columns:repeat(9,9.1vw);grid-template-rows:repeat(9,9.1vw)}
 .cell{font-size:16px}
}
</style>
</head>
<body>

<div id="startScreen">
  <div class="startCard">
    <h1>🍓 재미있는 스도쿠! 🍵</h1>
    <div class="startCat">🐱</div>
    <p>고양이와 함께 숫자 퍼즐을 풀어요!</p>
    <p><b>먼저 난이도를 선택해 주세요.</b></p>
    <select id="startDifficulty">
      <option value="easy">🍓 초급</option>
      <option value="medium">🍵 중급</option>
      <option value="random">🎲 랜덤</option>
    </select>
    <br><br>
    <button class="startButton" onclick="startGame()">🎮 게임 시작!</button>
  </div>
</div>

<h1>🍓 재미있는 스도쿠! 🍵</h1>
<div class="subtitle">딸기처럼 달콤하고 말차처럼 포근한 숫자 퍼즐</div>

<div id="gameArea">
  <div>
    난이도
    <select id="difficulty" onchange="changeDifficulty()">
      <option value="easy">초급</option>
      <option value="medium">중급</option>
      <option value="random">랜덤</option>
    </select>
    <button onclick="newGame()">🎮 새 게임</button>
  </div>

  <div class="main">
    <div id="board" aria-label="스도쿠 게임판"></div>
    <div class="sidecat" onclick="petCat(event)" title="고양이를 쓰다듬어 주세요!">
      <div class="catface">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="nose"></div>
        <div class="mouth">⌣</div>
      </div>
      <div class="catbody"></div>
      <div class="catmsg" id="catmsg">냐옹! 같이 퍼즐을 풀어요 💗</div>
    </div>
  </div>

  <div class="tools">
    <div id="numbers"></div>
    <button onclick="hint()">💡 힌트</button>
    <button onclick="erase()">🧽 지우기</button>
    <button onclick="toggleNotes()">✏️ 메모 <span id="noteState">끄기</span></button>
    <button onclick="checkBoard()">✅ 정답 확인</button>
    <button onclick="showSolution()">🌟 정답 보기</button>
    <div id="message"></div>
  </div>
</div>

<script>
const boardEl=document.getElementById('board');
const numbersEl=document.getElementById('numbers');

let puzzle=[];
let solution=[];
let fixed=[];
let selected=-1;
let notesMode=false;
let notes=Array.from({length:81},()=>new Set());

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pattern(r,c){
  return (r*3+Math.floor(r/3)+c)%9;
}

function makeSolution(){
  let digits=shuffle([1,2,3,4,5,6,7,8,9]);
  let rows=[],cols=[];
  let groups=shuffle([0,1,2]);

  for(let g of groups){
    for(let n of shuffle([0,1,2])) rows.push(g*3+n);
  }

  groups=shuffle([0,1,2]);
  for(let g of groups){
    for(let n of shuffle([0,1,2])) cols.push(g*3+n);
  }

  return rows.flatMap(r=>cols.map(c=>digits[pattern(r,c)]));
}

function startGame(){
  document.getElementById('difficulty').value=
    document.getElementById('startDifficulty').value;

  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameArea').style.display='block';
  newGame();
}

function changeDifficulty(){
  document.getElementById('message').textContent=
    '난이도를 바꾸셨습니다. 새 게임을 눌러 적용하세요!';
}

function newGame(){
  solution=makeSolution();
  puzzle=solution.slice();

  const diff=document.getElementById('difficulty').value;
  let blanks;

  if(diff==='easy') blanks=30;
  else if(diff==='medium') blanks=50;
  else blanks=Math.random()<0.5?30:50;

  const positions=shuffle([...Array(81).keys()]);
  for(let i=0;i<blanks;i++){
    puzzle[positions[i]]=0;
  }

  fixed=puzzle.map(n=>n!==0);
  notes=Array.from({length:81},()=>new Set());
  selected=-1;
  notesMode=false;

  document.getElementById('noteState').textContent='끄기';
  document.getElementById('message').textContent=
    diff==='easy'?'🍓 초급 게임 시작!':
    diff==='medium'?'🍵 중급 게임 시작!':
    '🎲 랜덤 난이도 게임 시작!';

  render();
  renderNumbers();
}

function render(){
  boardEl.innerHTML='';

  for(let i=0;i<81;i++){
    let d=document.createElement('div');
    d.className='cell';

    if(fixed[i]) d.classList.add('fixed');

    if(i===selected){
      d.classList.add('selected');
    }else if(selected>=0&&(
      i%9===selected%9||
      Math.floor(i/9)===Math.floor(selected/9)||
      (Math.floor(i/27)===Math.floor(selected/27)&&
      Math.floor(i%9/3)===Math.floor(selected%9/3))
    )){
      d.classList.add('same');
    }

    if(puzzle[i]){
      d.textContent=puzzle[i];
    }else if(notes[i].size){
      let n=document.createElement('span');
      n.className='note';
      n.textContent=[...notes[i]].sort().join(' ');
      d.appendChild(n);
    }

    d.onclick=()=>{
      selected=i;
      render();
    };

    boardEl.appendChild(d);
  }
}

function renderNumbers(){
  numbersEl.innerHTML='';
  for(let n=1;n<=9;n++){
    let b=document.createElement('button');
    b.textContent=n;
    b.onclick=()=>enterNumber(n);
    numbersEl.appendChild(b);
  }
}

function enterNumber(n){
  if(selected<0){
    document.getElementById('message').textContent='먼저 숫자를 넣을 칸을 선택해 주세요.';
    return;
  }

  if(fixed[selected]){
    document.getElementById('message').textContent='처음부터 있던 숫자는 바꿀 수 없어요.';
    return;
  }

  if(notesMode){
    if(notes[selected].has(n)) notes[selected].delete(n);
    else notes[selected].add(n);
  }else{
    puzzle[selected]=n;
    notes[selected].clear();
  }

  render();
}

function erase(){
  if(selected<0) return;
  if(!fixed[selected]){
    puzzle[selected]=0;
    notes[selected].clear();
    render();
  }
}

function toggleNotes(){
  notesMode=!notesMode;
  document.getElementById('noteState').textContent=notesMode?'켜기':'끄기';
  document.getElementById('message').textContent=
    notesMode?'메모 모드입니다.':'일반 입력 모드입니다.';
}

function hint(){
  if(selected<0){
    document.getElementById('message').textContent='힌트를 받을 칸을 선택해 주세요.';
    return;
  }

  if(fixed[selected]){
    document.getElementById('message').textContent='빈칸을 선택해 주세요.';
    return;
  }

  puzzle[selected]=solution[selected];
  notes[selected].clear();
  render();
  document.getElementById('message').textContent='힌트 숫자를 넣었어요! 💡';
}

function checkBoard(){
  let bad=0,empty=0;

  for(let i=0;i<81;i++){
    if(!puzzle[i]) empty++;
    else if(puzzle[i]!==solution[i]) bad++;
  }

  document.getElementById('message').textContent=
    bad?'다른 숫자가 '+bad+'개 있어요. 천천히 다시 해봐요! 💗':
    empty?'좋아요! 아직 빈칸이 '+empty+'개 남았어요.':
    '🎉 완벽해요! 스도쿠를 완성했어요!';
}

function showSolution(){
  puzzle=solution.slice();
  render();
  document.getElementById('message').textContent='정답을 모두 보여 드렸어요! 🌟';
}

function petCat(e){
  document.getElementById('catmsg').textContent=[
    '냐옹~ 잘하고 있어요! 💗',
    '천천히 해도 괜찮아요 🍵',
    '멋진 퍼즐 탐험가예요! ✨',
    '고양이 파워를 드릴게요! 🐾'
  ][Math.floor(Math.random()*4)];

  for(let j=0;j<5;j++){
    let h=document.createElement('span');
    h.className='heart';
    h.textContent='♥';
    h.style.left=(e.clientX+Math.random()*70-35)+'px';
    h.style.top=(e.clientY+Math.random()*15)+'px';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1000);
  }
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('gameArea').style.display==='none') return;

  if(e.key>='1'&&e.key<='9') enterNumber(Number(e.key));
  if(e.key==='Backspace'||e.key==='Delete') erase();

  if(e.key.startsWith('Arrow')&&selected>=0){
    e.preventDefault();
    let r=Math.floor(selected/9),c=selected%9;
    if(e.key==='ArrowUp') r=(r+8)%9;
    if(e.key==='ArrowDown') r=(r+1)%9;
    if(e.key==='ArrowLeft') c=(c+8)%9;
    if(e.key==='ArrowRight') c=(c+1)%9;
    selected=r*9+c;
    render();
  }
});
</script>
</body>
</html>
