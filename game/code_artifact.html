<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 틱택토 (Tic-Tac-Toe)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti for Win Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            cyan: '#00f2fe',
                            pink: '#ff0844',
                            purple: '#7f00ff',
                            dark: '#0f172a',
                            cardDark: '#1e293b'
                        }
                    },
                    boxShadow: {
                        'neon-cyan': '0 0 20px rgba(0, 242, 254, 0.5), inset 0 0 10px rgba(0, 242, 254, 0.3)',
                        'neon-pink': '0 0 20px rgba(255, 8, 68, 0.5), inset 0 0 10px rgba(255, 8, 68, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        .glow-text-cyan {
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.8);
        }
        .glow-text-pink {
            text-shadow: 0 0 12px rgba(255, 8, 68, 0.8);
        }
        .cell-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cell-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        /* Winning Line pulse animation */
        @keyframes pulseLine {
            0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 8px currentColor); }
            50% { opacity: 0.5; filter: drop-shadow(0 0 2px currentColor); }
        }
        .winning-line {
            animation: pulseLine 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between transition-colors duration-300 select-none overflow-x-hidden">

    <!-- Header Section -->
    <header class="w-full max-w-lg mx-auto p-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-pink-500 flex items-center justify-center font-black text-2xl shadow-lg text-slate-900">
                ✕
            </div>
            <h1 class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-300 to-pink-500">
                TIC TAC TOE
            </h1>
        </div>

        <!-- Top Right Actions -->
        <div class="flex items-center gap-2">
            <!-- Sound Toggle Button -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700/50" title="음소거/음소거 해제">
                <i id="soundIcon" class="fas fa-volume-up text-lg"></i>
            </button>
            <!-- Theme Toggle Button -->
            <button id="themeToggleBtn" onclick="toggleTheme()" class="p-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700/50" title="테마 변경">
                <i id="themeIcon" class="fas fa-moon text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-lg mx-auto px-4 flex-grow flex flex-col justify-center items-center gap-5 my-2">

        <!-- Mode & Difficulty Selectors -->
        <div class="w-full bg-slate-800/60 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3 flex flex-col gap-3 shadow-xl">
            <!-- Game Mode Switcher -->
            <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/80 rounded-xl border border-slate-800">
                <button id="modeAiBtn" onclick="setGameMode('ai')" class="py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-md">
                    <i class="fas fa-robot"></i> AI 대전
                </button>
                <button id="modePvpBtn" onclick="setGameMode('pvp')" class="py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white">
                    <i class="fas fa-users"></i> 2인 플레이
                </button>
            </div>

            <!-- Difficulty Switcher (Only visible in AI Mode) -->
            <div id="difficultyContainer" class="flex items-center justify-between px-2 pt-1">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">AI 난이도</span>
                <div class="flex gap-1.5 bg-slate-900/60 p-1 rounded-lg border border-slate-800">
                    <button id="diffEasy" onclick="setDifficulty('easy')" class="px-3 py-1 rounded text-xs font-bold transition-all text-slate-400 hover:text-white">쉬움</button>
                    <button id="diffMedium" onclick="setDifficulty('medium')" class="px-3 py-1 rounded text-xs font-bold transition-all bg-slate-700 text-cyan-300">보통</button>
                    <button id="diffHard" onclick="setDifficulty('hard')" class="px-3 py-1 rounded text-xs font-bold transition-all text-slate-400 hover:text-white">불가능</button>
                </div>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="w-full grid grid-cols-3 gap-3">
            <!-- Player X Score -->
            <div id="cardX" class="bg-slate-800/80 border-2 border-cyan-500/50 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg transition-all relative overflow-hidden">
                <div class="text-xs font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span>플레이어 X</span>
                    <span id="labelXRole" class="text-[10px] bg-cyan-950 text-cyan-300 px-1.5 py-0.5 rounded border border-cyan-800">(나)</span>
                </div>
                <div id="scoreX" class="text-3xl font-black text-cyan-400 mt-1 glow-text-cyan">0</div>
            </div>

            <!-- Ties Score -->
            <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">무승부</div>
                <div id="scoreTies" class="text-3xl font-black text-slate-300 mt-1">0</div>
            </div>

            <!-- Player O Score -->
            <div id="cardO" class="bg-slate-800/80 border border-slate-700/50 rounded-2xl p-3 flex flex-col items-center justify-center shadow-lg transition-all relative overflow-hidden">
                <div class="text-xs font-bold text-pink-500 uppercase tracking-wider flex items-center gap-1.5">
                    <span>플레이어 O</span>
                    <span id="labelORole" class="text-[10px] bg-pink-950 text-pink-300 px-1.5 py-0.5 rounded border border-pink-800">(AI)</span>
                </div>
                <div id="scoreO" class="text-3xl font-black text-pink-500 mt-1">0</div>
            </div>
        </div>

        <!-- Current Turn Status -->
        <div class="w-full bg-slate-800/40 rounded-xl py-2 px-4 border border-slate-700/30 flex items-center justify-between text-sm">
            <div class="flex items-center gap-2">
                <span class="text-slate-400">현재 차례:</span>
                <span id="turnIndicator" class="font-extrabold text-cyan-400 flex items-center gap-1.5 text-base">
                    <i class="fas fa-times"></i> X 차례
                </span>
            </div>
            <div id="aiThinkingStatus" class="hidden text-xs text-amber-400 font-semibold animate-pulse flex items-center gap-1">
                <i class="fas fa-brain"></i> AI 생각 중...
            </div>
        </div>

        <!-- Game Board Container -->
        <div class="relative w-full aspect-square max-w-[360px] bg-slate-800/90 border border-slate-700/80 rounded-3xl p-3.5 shadow-2xl backdrop-blur-md">
            
            <!-- 3x3 Grid -->
            <div class="grid grid-cols-3 grid-rows-3 gap-3 w-full h-full">
                <!-- 9 Cells generated with data-index -->
                <button data-index="0" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="1" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="2" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="3" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="4" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="5" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="6" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="7" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
                <button data-index="8" class="cell cell-transition bg-slate-900/90 hover:bg-slate-700/50 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl font-black focus:outline-none"></button>
            </div>

            <!-- SVG Overlay for Dynamic Winning Line -->
            <svg id="winningLineSvg" class="absolute inset-0 w-full h-full pointer-events-none z-10 p-3.5 hidden">
                <line id="winningLine" x1="0" y1="0" x2="0" y2="0" stroke="currentColor" stroke-width="8" stroke-linecap="round" class="winning-line" />
            </svg>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3 w-full max-w-[360px] mt-1">
            <button onclick="resetGame(false)" class="flex-1 py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-slate-300 transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95">
                <i class="fas fa-rotate-left"></i> 판 다시 시작
            </button>
            <button onclick="resetScores()" class="py-3 px-4 bg-slate-800/60 hover:bg-slate-700/60 border border-slate-700/60 rounded-xl font-bold text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95" title="점수 초기화">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center p-4 text-xs text-slate-500">
        틱택토 모던 웹 게임 &bull; 스마트 AI & HTML5
    </footer>

    <!-- Result Celebration Modal -->
    <div id="resultModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center z-50 opacity-0 pointer-events-none transition-all duration-300 p-4">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-all duration-300 id-modal-card">
            
            <div id="modalIconContainer" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 border-4 shadow-xl">
                ✕
            </div>

            <h2 id="modalTitle" class="text-2xl font-black mb-1">X 승리!</h2>
            <p id="modalSubtitle" class="text-slate-400 text-sm mb-6">축하합니다! 완벽한 승리입니다.</p>

            <div class="flex flex-col gap-2.5">
                <button onclick="closeModalAndReset()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold rounded-xl shadow-lg transition-all transform active:scale-95">
                    다음 라운드 플레이
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- GAME STATE ---
        let board = Array(9).fill('');
        let currentPlayer = 'X'; // X starts first
        let isGameActive = true;
        let gameMode = 'ai'; // 'ai' or 'pvp'
        let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
        let soundEnabled = true;
        let isDarkMode = true;
        let scores = { X: 0, O: 0, ties: 0 };
        let isAiThinking = false;

        // Winning combinations
        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]              // Diagonals
        ];

        // Web Audio API Context
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        // Play Tone Sound Effects
        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'clickX') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now); // A4
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'clickO') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    // Short arpeggio for win
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);

                        noteOsc.type = 'sine';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        noteGain.gain.setValueAtTime(0.2, now + idx * 0.08);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);

                        noteOsc.start(now + idx * 0.08);
                        noteOsc.stop(now + idx * 0.08 + 0.25);
                    });
                } else if (type === 'tie') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(180, now + 0.25);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.error("Audio error", e);
            }
        }

        // DOM Elements
        const cells = document.querySelectorAll('.cell');
        const turnIndicator = document.getElementById('turnIndicator');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreTiesEl = document.getElementById('scoreTies');
        const cardX = document.getElementById('cardX');
        const cardO = document.getElementById('cardO');
        const modeAiBtn = document.getElementById('modeAiBtn');
        const modePvpBtn = document.getElementById('modePvpBtn');
        const difficultyContainer = document.getElementById('difficultyContainer');
        const labelXRole = document.getElementById('labelXRole');
        const labelORole = document.getElementById('labelORole');
        const aiThinkingStatus = document.getElementById('aiThinkingStatus');

        // Modal Elements
        const resultModal = document.getElementById('resultModal');
        const modalIconContainer = document.getElementById('modalIconContainer');
        const modalTitle = document.getElementById('modalTitle');
        const modalSubtitle = document.getElementById('modalSubtitle');
        const winningLineSvg = document.getElementById('winningLineSvg');
        const winningLine = document.getElementById('winningLine');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            updateTurnDisplay();
        });

        // Cell Click Handler
        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute('data-index'));

            // Ignore if cell occupied, game inactive, or AI is playing
            if (board[index] !== '' || !isGameActive || isAiThinking) return;

            makeMove(index, currentPlayer);

            // If game still active & in AI mode, let AI play
            if (isGameActive && gameMode === 'ai' && currentPlayer === 'O') {
                triggerAiMove();
            }
        }

        // Execute Move
        function makeMove(index, player) {
            board[index] = player;
            const cell = cells[index];

            // Render symbol with styling
            if (player === 'X') {
                cell.innerHTML = '<span class="cell-pop text-cyan-400 glow-text-cyan">✕</span>';
                playSound('clickX');
            } else {
                cell.innerHTML = '<span class="cell-pop text-pink-500 glow-text-pink">◯</span>';
                playSound('clickO');
            }

            // Check Win or Draw
            const winCombo = checkWin(board, player);
            if (winCombo) {
                handleWin(player, winCombo);
            } else if (board.every(cell => cell !== '')) {
                handleDraw();
            } else {
                // Switch Turn
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateTurnDisplay();
            }
        }

        // Check Win Logic
        function checkWin(currentBoard, player) {
            for (let combo of WINNING_COMBOS) {
                if (
                    currentBoard[combo[0]] === player &&
                    currentBoard[combo[1]] === player &&
                    currentBoard[combo[2]] === player
                ) {
                    return combo;
                }
            }
            return null;
        }

        // Handle Win Event
        function handleWin(winner, combo) {
            isGameActive = false;
            scores[winner]++;
            updateScoreboard();
            drawWinningLine(combo, winner);

            // Sound & Confetti
            playSound('win');
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            setTimeout(() => {
                showModal(winner);
            }, 800);
        }

        // Handle Draw Event
        function handleDraw() {
            isGameActive = false;
            scores.ties++;
            updateScoreboard();
            playSound('tie');

            setTimeout(() => {
                showModal('tie');
            }, 500);
        }

        // Update Turn Display and Active Card Highlight
        function updateTurnDisplay() {
            if (currentPlayer === 'X') {
                turnIndicator.innerHTML = `<i class="fas fa-times text-cyan-400"></i> <span class="text-cyan-400">X 차례</span>`;
                cardX.classList.add('border-cyan-500', 'shadow-neon-cyan');
                cardX.classList.remove('border-slate-700/50');
                cardO.classList.remove('border-pink-500', 'shadow-neon-pink');
                cardO.classList.add('border-slate-700/50');
            } else {
                turnIndicator.innerHTML = `<i class="far fa-circle text-pink-500"></i> <span class="text-pink-500">O 차례</span>`;
                cardO.classList.add('border-pink-500', 'shadow-neon-pink');
                cardO.classList.remove('border-slate-700/50');
                cardX.classList.remove('border-cyan-500', 'shadow-neon-cyan');
                cardX.classList.add('border-slate-700/50');
            }
        }

        // Draw Winning SVG Line
        function drawWinningLine(combo, winner) {
            const boardRect = cells[0].parentElement.getBoundingClientRect();
            const cell0 = cells[combo[0]].getBoundingClientRect();
            const cell2 = cells[combo[2]].getBoundingClientRect();

            // Calculate center points relative to grid container
            const x1 = cell0.left + cell0.width / 2 - boardRect.left;
            const y1 = cell0.top + cell0.height / 2 - boardRect.top;
            const x2 = cell2.left + cell2.width / 2 - boardRect.left;
            const y2 = cell2.top + cell2.height / 2 - boardRect.top;

            winningLine.setAttribute('x1', x1);
            winningLine.setAttribute('y1', y1);
            winningLine.setAttribute('x2', x2);
            winningLine.setAttribute('y2', y2);

            const color = winner === 'X' ? '#00f2fe' : '#ff0844';
            winningLine.setAttribute('stroke', color);
            winningLineSvg.classList.remove('hidden');
        }

        // AI Move Controller
        function triggerAiMove() {
            isAiThinking = true;
            aiThinkingStatus.classList.remove('hidden');

            const delay = Math.floor(Math.random() * 300) + 400; // 400ms ~ 700ms delay for realism

            setTimeout(() => {
                if (!isGameActive) {
                    isAiThinking = false;
                    aiThinkingStatus.classList.add('hidden');
                    return;
                }

                let bestIndex;
                if (aiDifficulty === 'easy') {
                    bestIndex = getRandomMove();
                } else if (aiDifficulty === 'medium') {
                    // 50% chance optimal, 50% random
                    bestIndex = Math.random() < 0.5 ? getBestMoveMinimax() : getRandomMove();
                } else {
                    // Hard (Unbeatable Minimax)
                    bestIndex = getBestMoveMinimax();
                }

                isAiThinking = false;
                aiThinkingStatus.classList.add('hidden');

                if (bestIndex !== undefined && bestIndex !== null) {
                    makeMove(bestIndex, 'O');
                }
            }, delay);
        }

        // Random Empty Cell
        function getRandomMove() {
            const emptyCells = board.map((val, idx) => val === '' ? idx : null).filter(val => val !== null);
            if (emptyCells.length === 0) return null;
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        // Optimal Minimax Move
        function getBestMoveMinimax() {
            let bestScore = -Infinity;
            let move = null;

            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O'; // AI is 'O'
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }
            return move !== null ? move : getRandomMove();
        }

        // Minimax Algorithm
        function minimax(boardState, depth, isMaximizing) {
            if (checkWin(boardState, 'O')) return 10 - depth;
            if (checkWin(boardState, 'X')) return depth - 10;
            if (boardState.every(cell => cell !== '')) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (boardState[i] === '') {
                        boardState[i] = 'O';
                        let score = minimax(boardState, depth + 1, false);
                        boardState[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (boardState[i] === '') {
                        boardState[i] = 'X';
                        let score = minimax(boardState, depth + 1, true);
                        boardState[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        // Mode Change
        function setGameMode(mode) {
            if (gameMode === mode) return;
            gameMode = mode;

            if (mode === 'ai') {
                modeAiBtn.className = "py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-md";
                modePvpBtn.className = "py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white";
                difficultyContainer.classList.remove('hidden');
                labelXRole.textContent = '(나)';
                labelORole.textContent = '(AI)';
            } else {
                modePvpBtn.className = "py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 bg-gradient-to-r from-pink-500 to-purple-600 text-white shadow-md";
                modeAiBtn.className = "py-2.5 px-4 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 text-slate-400 hover:text-white";
                difficultyContainer.classList.add('hidden');
                labelXRole.textContent = '(1P)';
                labelORole.textContent = '(2P)';
            }

            resetGame(true);
        }

        // Difficulty Change
        function setDifficulty(diff) {
            aiDifficulty = diff;
            const btns = {
                easy: document.getElementById('diffEasy'),
                medium: document.getElementById('diffMedium'),
                hard: document.getElementById('diffHard')
            };

            Object.keys(btns).forEach(key => {
                if (key === diff) {
                    btns[key].className = "px-3 py-1 rounded text-xs font-bold transition-all bg-slate-700 text-cyan-300 shadow";
                } else {
                    btns[key].className = "px-3 py-1 rounded text-xs font-bold transition-all text-slate-400 hover:text-white";
                }
            });

            resetGame(true);
        }

        // Reset Board Game
        function resetGame(resetScoresFlag = false) {
            board = Array(9).fill('');
            currentPlayer = 'X';
            isGameActive = true;
            isAiThinking = false;
            aiThinkingStatus.classList.add('hidden');

            cells.forEach(cell => {
                cell.innerHTML = '';
            });

            winningLineSvg.classList.add('hidden');
            updateTurnDisplay();

            if (resetScoresFlag) {
                resetScores();
            }
        }

        // Reset Scoreboard
        function resetScores() {
            scores = { X: 0, O: 0, ties: 0 };
            updateScoreboard();
        }

        function updateScoreboard() {
            scoreXEl.textContent = scores.X;
            scoreOEl.textContent = scores.O;
            scoreTiesEl.textContent = scores.ties;
        }

        // Result Modal Helper
        function showModal(result) {
            resultModal.classList.remove('opacity-0', 'pointer-events-none');
            const modalCard = resultModal.querySelector('.id-modal-card');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');

            if (result === 'X') {
                modalIconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 border-4 bg-cyan-950/80 border-cyan-500 text-cyan-400 shadow-neon-cyan";
                modalIconContainer.innerHTML = "✕";
                modalTitle.textContent = gameMode === 'ai' ? "플레이어 X 승리!" : "1P (X) 승리!";
                modalSubtitle.textContent = "뛰어난 전략으로 완벽한 승리를 거두었습니다!";
            } else if (result === 'O') {
                modalIconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 border-4 bg-pink-950/80 border-pink-500 text-pink-500 shadow-neon-pink";
                modalIconContainer.innerHTML = "◯";
                modalTitle.textContent = gameMode === 'ai' ? "AI 승리!" : "2P (O) 승리!";
                modalSubtitle.textContent = gameMode === 'ai' ? "AI가 승리했습니다. 다시 도전해 보세요!" : "축하합니다! 멋진 승리입니다.";
            } else {
                modalIconContainer.className = "w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 border-4 bg-slate-800 border-slate-600 text-slate-300";
                modalIconContainer.innerHTML = "⚖️";
                modalTitle.textContent = "비겼습니다!";
                modalSubtitle.textContent = "팽팽한 승부였습니다. 다음 라운드에서 승부를 가려보세요!";
            }
        }

        function closeModalAndReset() {
            const modalCard = resultModal.querySelector('.id-modal-card');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            resultModal.classList.add('opacity-0', 'pointer-events-none');

            resetGame(false);
        }

        // Sound Toggle
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const soundIcon = document.getElementById('soundIcon');
            const soundToggleBtn = document.getElementById('soundToggleBtn');

            if (soundEnabled) {
                soundIcon.className = "fas fa-volume-up text-lg";
                soundToggleBtn.classList.remove('text-red-400');
            } else {
                soundIcon.className = "fas fa-volume-mute text-lg";
                soundToggleBtn.classList.add('text-red-400');
            }
        }

        // Theme Toggle (Dark / Light Modern Mod)
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');

            if (isDarkMode) {
                body.classList.remove('bg-slate-100', 'text-slate-800');
                body.classList.add('bg-slate-900', 'text-slate-100');
                themeIcon.className = "fas fa-moon text-lg";
            } else {
                body.classList.remove('bg-slate-900', 'text-slate-100');
                body.classList.add('bg-slate-100', 'text-slate-800');
                themeIcon.className = "fas fa-sun text-lg text-amber-500";
            }
        }
    </script>
</body>
</html>
